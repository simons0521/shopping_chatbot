<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>网购智能客服</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>

        body{
            background:#f5f5f5;
            font-family:Arial;
        }

        .chat-container{
            width:600px;
            margin:50px auto;
            background:white;
            border-radius:10px;
            padding:20px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
        }

        .chat-box{
            height:500px;
            overflow-y:auto;
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:20px;
            background:#fafafa;
        }

        .message{
            margin:10px 0;
            display:flex;
        }

        .user{
            justify-content:flex-end;
        }

        .bot{
            justify-content:flex-start;
        }

        .bubble{
            max-width:70%;
            padding:10px;
            border-radius:10px;
            position:relative;
        }
        .time{
            font-size:12px;
            margin-top:5px;
            opacity:0.7;
            text-align:right;
        }
        .user .bubble{
            background:#007bff;
            color:white;
        }

        .bot .bubble{
            background:#e5e5ea;
        }

        .input-area{
            display:flex;
        }

        input{
            flex:1;
            padding:10px;
            font-size:16px;
        }

        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            cursor:pointer;
        }
        .markdown-body{
            line-height:1.6;
        }

        .markdown-body pre{
            background:#1e1e1e;
            color:white;
            padding:10px;
            border-radius:5px;
            overflow-x:auto;
        }

        .markdown-body code{
            background:#eee;
            padding:2px 4px;
            border-radius:4px;
        }

    </style>

</head>

<body>

<div class="chat-container">

    <h1>网购智能客服</h1>

    <div class="chat-box" id="chat-box">

    </div>

    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="请输入你的问题"
            onkeydown="handleKey(event)"
        >

        <button onclick="askQuestion()">
            发送
        </button>

    </div>

</div>

<script>

async function askQuestion(){

    // 获取输入框
    const input = document.getElementById("question");

    const question = input.value;

    // 空内容不发送
    if(question.trim() === ""){
        return;
    }

    // 添加用户消息
    addMessage(question,"user");

    // 清空输入框
    input.value = "";

    // 创建“思考中”消息
    const loadingId = addMessage(
        "客服正在思考...",
        "bot"
    );

    try{

        // 请求后端
        const response = await fetch("/ask",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                question:question,
                session_id:'001',
                k:3,
                merge_answers:true
            })

        });

        // 转JSON
        const data = await response.json();

        // 流式更新AI消息
        await streamMessage(
            loadingId,
            data.answers.join("\n")
        );

    }catch(error){

        console.error(error);

        updateMessage(
            loadingId,
            "请求失败，请稍后重试"
        );
    }
}

function handleKey(event){

    if(event.key === "Enter"){
        askQuestion();
    }

}

function getCurrentTime(){

    const now = new Date();

    return now.getHours()
        .toString()
        .padStart(2,"0")
        +
        ":"
        +
        now.getMinutes()
        .toString()
        .padStart(2,"0");
}

function addMessage(text,type){

    const chatBox =
        document.getElementById("chat-box");

    // 创建消息容器
    const messageDiv =
        document.createElement("div");

    const messageId =
        "msg-" + Date.now();

    messageDiv.id = messageId;

    messageDiv.classList.add("message");

    messageDiv.classList.add(type);

    // 创建气泡
    const bubbleDiv =
        document.createElement("div");

    bubbleDiv.classList.add("bubble");

    bubbleDiv.innerHTML =
    `
    <div class="markdown-body">
        ${marked.parse(text)}
    </div>

    <div class="time">
        ${getCurrentTime()}
    </div>
    `;

    // 拼装
    messageDiv.appendChild(bubbleDiv);

    chatBox.appendChild(messageDiv);

    // 滚动到底部
    chatBox.scrollTop =
        chatBox.scrollHeight;

    return messageId;
}

function updateMessage(id,text){

    const messageDiv =
        document.getElementById(id);

    if(!messageDiv){
        return;
    }

    const bubbleDiv =
        messageDiv.querySelector(".bubble");

    bubbleDiv.innerHTML =
    `
    <div class="markdown-body">
        ${marked.parse(text)}
    </div>

    <div class="time">
        ${getCurrentTime()}
    </div>
    `;

    const chatBox =
        document.getElementById("chat-box");

    chatBox.scrollTop =
        chatBox.scrollHeight;
}

async function streamMessage(id,text){

    let currentText = "";

    for(let i=0;i<text.length;i++){

        currentText += text[i];

        updateMessage(id,currentText);

        await new Promise(resolve =>
            setTimeout(resolve,20)
        );
    }
}

</script>

</body>
</html>
